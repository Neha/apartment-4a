# Builds the app image (linux/amd64) and pushes it to ghcr.io.
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name and short SHA
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/apartment-4a" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      # Optional: tell the homelab deploy repo a new image exists so it can roll it out.
      # Skipped unless the PLATFORM_DEPLOY_TOKEN secret is set.
      - name: Notify deploy repo
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_DEPLOY_TOKEN }}
        if: env.GH_TOKEN != ''
        run: |
          gh api repos/jaswantsandhu/platform-deploy/dispatches \
            -f event_type=apartment-4a-image \
            -f "client_payload[tag]=sha-${{ steps.meta.outputs.short }}"
